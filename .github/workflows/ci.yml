name: CI

on:
  push:
    branches: [samar]

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

  lint:
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Lint du code
        run: yarn lint
  
  cypress-tests:
      runs-on: ubuntu-latest
      needs: deps

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Use Node.js 20
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: yarn

        - name: Enable Corepack
          run: corepack enable

        - name: Install dependencies
          run: yarn install

        - name: Seed DB + mock AWS + build env
          run: |
            yarn db:seed:dev
            yarn predev:cognito:ci
            yarn copy:mock:awsexports
            yarn copy:mock:awsexportses5
        - name: Start backend and frontend
          run: |
            yarn start:api:ci &
            yarn start:react &
            npx wait-on http://localhost:3000 http://localhost:3001
  
        - name: Run Cypress tests
          run: yarn cypress:run --env coverage=true
