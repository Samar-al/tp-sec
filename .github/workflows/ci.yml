name: CI

on:
  push:
    branches: [samar]

jobs:
  # 1) Install deps
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable || true

      - name: Install dependencies
        run: yarn install

  # 2) Lint
  lint:
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable || true

      - name: Install dependencies
        run: yarn install

      - name: Lint du code
        run: yarn lint

  # 3) Tests unitaires / composants (couverture)
  unit-component-tests:
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable || true

      - name: Install dependencies
        run: yarn install

      # ⚠️ tu m’as dit que tu avais "yarn dev:coverage"
      - name: Run unit + component tests with coverage
        run: yarn dev:coverage

  # 4) Cypress (UI + API) via yarn cypress:run --env coverage=true
  cypress-tests:
    runs-on: ubuntu-latest
    needs: unit-component-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable || true

      - name: Install dependencies
        run: yarn install

      # On lance EXACTEMENT comme en local : yarn dev
      # qui fait db:seed, mock aws, start:react, start:api:watch
      - name: Start app (frontend + backend) and wait
        run: |
          yarn dev &
          npx wait-on http://localhost:3000 http://localhost:3001 --timeout 600000

      - name: Run Cypress tests with coverage
        run: yarn cypress:run --env coverage=true