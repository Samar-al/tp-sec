name: CI

on:
  push:
    branches: [samar]

jobs:
  # 1) Install deps
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable || true

      - name: Install dependencies
        run: yarn install

  # 2) Lint
  lint:
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable || true

      - name: Install dependencies
        run: yarn install

      - name: Lint du code
        run: yarn lint

  # 3) Tests unitaires / composants (couverture)
  unit-component-tests:
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable || true

      - name: Install dependencies
        run: yarn install

      - name: Prepare env (same as yarn dev)
        run: |
          yarn db:seed:dev
          yarn predev:cognito:ci
          yarn copy:mock:awsexports
          yarn copy:mock:awsexportses5

      - name: Run unit + component tests with coverage
        run: yarn dev:coverage
      - name: Run Cypress tests with coverage
        run: yarn cypress:run --env coverage=true  
