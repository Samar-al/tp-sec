name: CI

on:
  push:
    branches: [samar]

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

  lint:
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Lint du code
        run: yarn lint
  
  cypress-tests:
      runs-on: ubuntu-latest
      needs: deps

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Use Node.js 20
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: yarn

        - name: Enable Corepack
          run: corepack enable

        - name: Install dependencies
          run: yarn install

        - name: Start dev server
          run: yarn dev
        
        - name: Run Cypress tests
          uses: cypress-io/github-action@v6
          with:
            wait-on: 'http://localhost:3000'
            command: yarn cypress:run --env coverage=true

  dependencies-check:
      runs-on: ubuntu-latest
      needs: deps

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Use Node.js 20
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: yarn

        - name: Enable Corepack
          run: corepack enable

        - name: Install dependencies
          run: yarn install

        - name: Yarn audit (security scan)
          run: yarn audit --level moderate