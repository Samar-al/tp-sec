name: CI

on:
  push:
    branches: [samar]

jobs:
  # 1) Install deps
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable || true

      - name: Install dependencies
        run: yarn install

  # 2) Lint
  lint:
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable || true

      - name: Install dependencies
        run: yarn install

      - name: Lint du code
        run: yarn lint

  # 3) Tests unitaires / composants (couverture)
  cypress-tests:
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable || true

      - name: Install dependencies
        run: yarn install

      - name: Prepare env (same as yarn dev)
        run: |
          yarn db:seed:dev
          yarn predev:cognito:ci
          yarn copy:mock:awsexports
          yarn copy:mock:awsexportses5

      - name: Start app with coverage
        run: |
          yarn dev:coverage &
          npx wait-on http://localhost:3000 http://localhost:3001 --timeout 600000
    
      - name: Run Cypress tests with coverage
        run: yarn cypress:run --env coverage=true

  security-scan:
      runs-on: ubuntu-latest
      needs: deps

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Use Node.js 20
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: yarn

        - name: Enable Corepack
          run: corepack enable || true

        - name: Install dependencies
          run: yarn install

        - name: Security scan (high/critical vulns)
          run: yarn audit --level high || true

  yarn-audit:
      runs-on: ubuntu-latest
      needs: deps

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Use Node.js 20
          uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: yarn

        - name: Enable Corepack
          run: corepack enable || true

        - name: Install dependencies
          run: yarn install

        # Exit code 30 = vulnerabilities found → "|| true" to not break the build
        - name: Yarn audit (moderate+)
          run: yarn audit --level moderate || true

  jmeter:
    runs-on: ubuntu-latest
    needs: [cypress-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run JMeter plan
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/jmeter \
            -w /jmeter \
            justb4/jmeter:5.5 \
            -n -t tests/jmeter/plan.jmx -l tests/jmeter/results.jtl
      - name: Upload JMeter results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: tests/jmeter/results.jtl