name: CI - tp-sec

on:
  push:
    branches: [samar]

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - name: Enable corePack
        run: corepack enable
      - name: Install dependencies
        run: yarn install

  lint:
    runs-on: ubuntu-latest
    needs: deps

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable corePack
        run: corepack enable
      - name: Install dependencies
        run: yarn
  
      - name: lint du code 
        uses: yarn lint



